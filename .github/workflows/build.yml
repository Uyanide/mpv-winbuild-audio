name: build

on:
  push:
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag against versions.env
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          . ./versions.env
          expected=v$MPV_VERSION-$BUILD_REV
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "tag is $GITHUB_REF_NAME but versions.env builds $expected" >&2
            echo "bump BUILD_REV (or MPV_VERSION) to match, then retag" >&2
            exit 1
          fi

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            $(sed -e 's/#.*//' -e '/^[[:space:]]*$/d' docker/packages.txt)
          # posix-threads default would import libwinpthread-1.dll
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-win32
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-win32

      # mpv embeds its absolute build paths, so build at the same path as ./dev.sh.
      - name: Mount the workspace where ./dev.sh builds
        run: |
          sudo mkdir -p /work
          sudo mount --bind "$GITHUB_WORKSPACE" /work
          test /work/build.sh -ef "$GITHUB_WORKSPACE/build.sh"

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-ubuntu-24.04-work-${{ hashFiles('versions.env', 'build.sh', 'cross/mingw64.ini') }}
          restore-keys: |
            ccache-ubuntu-24.04-work-

      - name: Build
        working-directory: /work
        run: ./build.sh

      - name: Verify
        working-directory: /work
        run: ./verify/verify.sh

      - uses: actions/upload-artifact@v7
        with:
          name: libmpv-audio-x86_64
          path: |
            dist/*.7z
            dist/SHA256SUMS
            dist/BUILDINFO.txt
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: libmpv-audio-x86_64
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '````text'; cat dist/BUILDINFO.txt; echo '````'; } >notes.md
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            dist/*.7z dist/SHA256SUMS dist/BUILDINFO.txt

  bump:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # Writes use BUMP_TOKEN: a PR opened with github.token triggers no CI.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.BUMP_TOKEN }}

      - name: Check upstream releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./tools/check-upstream.sh --update | tee /tmp/upstream-report.txt

      - name: Open or update the bump PR
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN }}
        run: |
          if git diff --quiet -- versions.env; then
            echo "everything already up to date"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch=bump/upstream
          git checkout -B "$branch"
          git commit -am "versions: bump upstream releases"
          # --force-with-lease needs the remote-tracking ref
          git fetch --quiet origin "+refs/heads/$branch:refs/remotes/origin/$branch" || true
          git push --force-with-lease -u origin "$branch"

          body=$(printf '%s\n' \
            'Automated monthly upstream check.' '' \
            '```' "$(cat /tmp/upstream-report.txt)" '```' '' \
            'Merging this does not publish anything -- push a `v<mpv>-<rev>` tag to release.' '' \
            'Worth a look before merging:' \
            '- an FFmpeg **major** bump drops deprecated APIs; check mpv builds against it' \
            '- a libplacebo bump can move ahead of what this mpv release expects' \
            '- reset `BUILD_REV` to 1 if `MPV_VERSION` changed, otherwise bump it')

          open_pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$open_pr" ]; then
            gh pr edit "$open_pr" --body "$body"
          else
            gh pr create --base "${GITHUB_REF_NAME}" --head "$branch" \
              --title "Bump upstream versions" --body "$body"
          fi
