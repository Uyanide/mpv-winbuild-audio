name: build

on:
  push:
    tags: ['v*']
  # So that the monthly bump PR is actually built and verified before anyone
  # merges it -- an upstream bump that does not build is the whole thing to catch.
  pull_request:
  schedule:
    # First of the month. This is both an upstream check and a bit-rot check: the
    # build job runs unconditionally, so a vanished tarball or a toolchain change
    # in ubuntu-24.04 shows up here instead of the next time someone cuts a release.
    - cron: '0 4 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The archive is named from versions.env and the release from the tag, and
      # nothing used to tie the two together: v0.41.0-2 was tagged without bumping
      # BUILD_REV, so it shipped an asset called libmpv-audio-x86_64-v0.41.0-1.7z --
      # a different DLL under a filename that already existed in another release,
      # which is the one way this repository could hand downstream the wrong bytes.
      # Cheap to check, and checked before the build rather than after it.
      - name: Check the tag against versions.env
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          . ./versions.env
          expected=v$MPV_VERSION-$BUILD_REV
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "tag is $GITHUB_REF_NAME but versions.env builds $expected" >&2
            echo "bump BUILD_REV (or MPV_VERSION) to match, then retag" >&2
            exit 1
          fi

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            $(sed -e 's/#.*//' -e '/^[[:space:]]*$/d' docker/packages.txt)
          # Ubuntu defaults these to posix threads, which pulls libwinpthread-1.dll
          # and libgcc_s_seh-1.dll into the output. Same line as docker/Dockerfile.
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-win32
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-win32

      # mpv bakes its entire meson command line into the DLL as the string it
      # reports as `Configuration:`, absolute -Dprefix= and --cross-file= included.
      # Building under $GITHUB_WORKSPACE therefore produced a DLL that could never
      # match a local ./dev.sh build, which builds at /work: same sources, same
      # toolchain, different bytes, purely because one path is longer than the
      # other. Mounting the workspace at /work removes the only variable there was.
      - name: Mount the workspace where ./dev.sh builds
        run: |
          sudo mkdir -p /work
          sudo mount --bind "$GITHUB_WORKSPACE" /work
          # A mount that silently did not take would build at the wrong path and
          # produce a green, subtly different artifact. -ef compares device+inode.
          test /work/build.sh -ef "$GITHUB_WORKSPACE/build.sh"

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          # The build path is part of what ccache hashes, so moving to /work costs
          # one cold build and then caches as before.
          key: ccache-ubuntu-24.04-work-${{ hashFiles('versions.env', 'build.sh', 'cross/mingw64.ini') }}
          restore-keys: |
            ccache-ubuntu-24.04-work-

      - name: Build
        working-directory: /work
        run: ./build.sh

      - name: Verify
        working-directory: /work
        run: ./verify/verify.sh

      - uses: actions/upload-artifact@v7
        with:
          name: libmpv-audio-x86_64
          path: |
            dist/*.7z
            dist/SHA256SUMS
            dist/BUILDINFO.txt
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: libmpv-audio-x86_64
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file dist/BUILDINFO.txt \
            dist/*.7z dist/SHA256SUMS dist/BUILDINFO.txt

  bump:
    # Only ever opens a PR. Releases stay a deliberate, human-tagged act, so an
    # upstream release can never silently change what downstream downloads.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Check upstream releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./tools/check-upstream.sh --update | tee /tmp/upstream-report.txt

      - name: Open or update the bump PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- versions.env; then
            echo "everything already up to date"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch=bump/upstream
          git checkout -B "$branch"
          git commit -am "versions: bump upstream releases"
          git push --force-with-lease -u origin "$branch"

          body=$(printf '%s\n' \
            'Automated monthly upstream check.' '' \
            '```' "$(cat /tmp/upstream-report.txt)" '```' '' \
            'Merging this does not publish anything -- push a `v<mpv>-<rev>` tag to release.' '' \
            'Worth a look before merging:' \
            '- an FFmpeg **major** bump drops deprecated APIs; check mpv builds against it' \
            '- a libplacebo bump can move ahead of what this mpv release expects' \
            '- reset `BUILD_REV` to 1 if `MPV_VERSION` changed, otherwise bump it')

          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            gh pr edit "$branch" --body "$body"
          else
            gh pr create --base "${GITHUB_REF_NAME}" --head "$branch" \
              --title "Bump upstream versions" --body "$body"
          fi
