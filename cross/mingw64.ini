# Meson cross file for x86_64 Windows via mingw-w64.
#
# The pkg-config entry resolves to the wrapper build.sh drops in build/tools,
# which pins PKG_CONFIG_LIBDIR to our own prefix so no host .pc file can leak in.
# The gcc/g++ entries may also resolve to ccache shims from that same directory.

[binaries]
c          = 'x86_64-w64-mingw32-gcc'
cpp        = 'x86_64-w64-mingw32-g++'
ar         = 'x86_64-w64-mingw32-ar'
ranlib     = 'x86_64-w64-mingw32-ranlib'
strip      = 'x86_64-w64-mingw32-strip'
objcopy    = 'x86_64-w64-mingw32-objcopy'
windres    = 'x86_64-w64-mingw32-windres'
# libplacebo does find_program('llvm-dlltool', 'dlltool'); only the
# triplet-prefixed one exists on PATH, so name it here explicitly.
dlltool    = 'x86_64-w64-mingw32-dlltool'
pkg-config = 'x86_64-w64-mingw32-pkg-config'

[properties]
# Never let meson try to execute a PE binary during configure.
needs_exe_wrapper = true

[host_machine]
system     = 'windows'
cpu_family = 'x86_64'
cpu        = 'x86_64'
endian     = 'little'

[built-in options]
c_args   = ['-O2', '-pipe', '-ffunction-sections', '-fdata-sections']
cpp_args = ['-O2', '-pipe', '-ffunction-sections', '-fdata-sections']
# -static keeps libwinpthread-1.dll / libgcc_s_seh-1.dll / libstdc++-6.dll out of
# the import table; verify/verify.sh asserts that this actually held.
c_link_args   = ['-static', '-static-libgcc', '-Wl,--gc-sections']
cpp_link_args = ['-static', '-static-libgcc', '-static-libstdc++', '-Wl,--gc-sections']
