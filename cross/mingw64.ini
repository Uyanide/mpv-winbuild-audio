# pkg-config and the ccache shims come from build/tools, set up by build.sh.

[binaries]
c          = 'x86_64-w64-mingw32-gcc'
cpp        = 'x86_64-w64-mingw32-g++'
ar         = 'x86_64-w64-mingw32-ar'
ranlib     = 'x86_64-w64-mingw32-ranlib'
strip      = 'x86_64-w64-mingw32-strip'
objcopy    = 'x86_64-w64-mingw32-objcopy'
windres    = 'x86_64-w64-mingw32-windres'
dlltool    = 'x86_64-w64-mingw32-dlltool'
pkg-config = 'x86_64-w64-mingw32-pkg-config'

[properties]
needs_exe_wrapper = true

[host_machine]
system     = 'windows'
cpu_family = 'x86_64'
cpu        = 'x86_64'
endian     = 'little'

[built-in options]
c_args   = ['-O2', '-pipe', '-ffunction-sections', '-fdata-sections']
cpp_args = ['-O2', '-pipe', '-ffunction-sections', '-fdata-sections']
c_link_args   = ['-static', '-static-libgcc', '-Wl,--gc-sections', '-Wl,--no-insert-timestamp']
cpp_link_args = ['-static', '-static-libgcc', '-static-libstdc++', '-Wl,--gc-sections', '-Wl,--no-insert-timestamp']
